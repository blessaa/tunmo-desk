appId: com.tunmo.desk
productName: 图墨
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!config/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.cursor/*'
  - '!.github/*'
  - '!resources{,/**}'
  - '!locales{,/**}'
  - '!*.dll'
  - '!*.exe'
  - '!*.pak'
  - '!*.bin'
  - '!*.dat'
  - '!LICENSE.electron.txt'
  - '!LICENSES.chromium.html'
  - '!vk_swiftshader_icd.json'
extraResources:
  - from: config/release.json
    to: release.json
  # electron-builder 的 extraResources 过滤器会丢掉拷贝根上的 node_modules
  # （它假定依赖由主应用 asar 收集）。后端是独立 Node 进程，必须再拷一份。
  - from: src/package
    to: tunmo-backend
    filter:
      - '**/*'
      - '!vendor{,/**}'
      - '!src{,/**}'
      - '!test{,/**}'
      - '!docs{,/**}'
      - '!node_modules{,/**}'
  - from: src/package/node_modules
    to: tunmo-backend/node_modules
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
win:
  executableName: tunmo-desk
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  artifactName: ${name}-${version}-${arch}-setup.${ext}
mac:
  executableName: tunmo-desk
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: 图墨需要访问工作目录
    - NSDownloadsFolderUsageDescription: 图墨需要访问下载目录
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${arch}-mac.${ext}
linux:
  executableName: tunmo-desk
  category: Development
  maintainer: tunmo
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}.${ext}
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  differentialPackage: true
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronUpdaterCompatibility: '>= 2.16'
publish:
  provider: github
  owner: blessaa
  repo: tunmo-desk
  releaseType: draft
