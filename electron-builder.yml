appId: com.tunmo.desk
productName: 图墨
directories:
  buildResources: build
  output: dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!config/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!.cursor/*'
  - '!.github/*'
  - '!build/tunmo-backend.asar'
  - '!build/tunmo-backend.asar.unpacked{,/**}'
  - '!resources{,/**}'
  - '!locales{,/**}'
  - '!*.dll'
  - '!*.exe'
  - '!*.pak'
  - '!*.bin'
  - '!*.dat'
  - '!LICENSE.electron.txt'
  - '!LICENSES.chromium.html'
  - '!vk_swiftshader_icd.json'
extraResources:
  - from: config/release.json
    to: release.json
  # 后端源码 esbuild 打成 dist/main.js，再和 Pi 的 node_modules 一起打进一份 asar。
  # extraResources 只拷这一份归档，避免 Windows 上拷两万个散文件。
  - from: build/tunmo-backend.asar
    to: tunmo-backend.asar
  - from: build/tunmo-backend.asar.unpacked
    to: tunmo-backend.asar.unpacked
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
win:
  executableName: tunmo-desk
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${name}-${version}-${arch}-setup.${ext}
mac:
  executableName: tunmo-desk
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: 图墨需要访问工作目录
    - NSDownloadsFolderUsageDescription: 图墨需要访问下载目录
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-${arch}-mac.${ext}
linux:
  executableName: tunmo-desk
  category: Development
  maintainer: tunmo
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}.${ext}
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  differentialPackage: true
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
electronUpdaterCompatibility: '>= 2.16'
publish:
  provider: github
  owner: blessaa
  repo: tunmo-desk
  releaseType: draft
